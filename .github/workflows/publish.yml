name: Package and Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published release tag (vX.Y.Z or vX.Y.Z-prerelease)
        required: true
        type: string

permissions:
  contents: read

env:
  npm_config_min_release_age: '7'

# Queue releases, recovery, and docs without cancelling an in-flight publication.
concurrency:
  group: npm-release-and-docs
  queue: max
  cancel-in-progress: false

jobs:
  select-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Validate the requested tag with reviewed main's scripts before
          # executing anything from that tag or a user-supplied checkout ref.
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node 24 for dependency-free provenance guards
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '^24.0.0'
          package-manager-cache: false

      - name: Check current release, remote tag, source versions, and main ancestry
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node bin/release.cjs select

  install-deps:
    needs: select-release
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.configure-nodejs.outputs.cache-key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.select-release.outputs.commit }}
          persist-credentials: false

      - name: Populate completed dependencies
        id: configure-nodejs
        uses: pwrdrvr/configure-nodejs@8876dbf3c524c8a765543dae3ae5b55d7b5ecfb3 # v1.6.0
        with:
          node-version: '^24.0.0'
          package-manager: pnpm
          working-directory: '.'
          dependency-cache: node-modules
          cache-mode: populate
          cache-inputs: packages/sitemaps-cdk/.projenrc.ts
          cache-key-suffix: streaming-sitemaps-8876dbf3c524c8a765543dae3ae5b55d7b5ecfb3-${{ hashFiles('package.json', 'packages/**/package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', '.npmrc', 'packages/**/.npmrc', 'packages/sitemaps-cdk/.projenrc.ts') }}

  publish:
    needs: [select-release, install-deps]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.select-release.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Restore completed dependencies
        id: configure-nodejs
        uses: pwrdrvr/configure-nodejs@8876dbf3c524c8a765543dae3ae5b55d7b5ecfb3 # v1.6.0
        with:
          node-version: '^24.0.0'
          package-manager: pnpm
          working-directory: '.'
          dependency-cache: node-modules
          cache-mode: restore
          cache-inputs: packages/sitemaps-cdk/.projenrc.ts
          cache-key-suffix: streaming-sitemaps-8876dbf3c524c8a765543dae3ae5b55d7b5ecfb3-${{ hashFiles('package.json', 'packages/**/package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', '.npmrc', 'packages/**/.npmrc', 'packages/sitemaps-cdk/.projenrc.ts') }}

      - name: Require completed cache key to match the producer
        env:
          PRODUCER_CACHE_KEY: ${{ needs.install-deps.outputs.cache-key }}
          CONSUMER_CACHE_KEY: ${{ steps.configure-nodejs.outputs.cache-key }}
        run: |
          test -n "$PRODUCER_CACHE_KEY"
          test "$CONSUMER_CACHE_KEY" = "$PRODUCER_CACHE_KEY"
          printf 'Completed dependency cache key: %s\n' "$CONSUMER_CACHE_KEY"

      - name: Verify release and recovery guards
        run: pnpm run test:foundation

      - name: Inject the verified explicit version after strict restore
        env:
          RELEASE_VERSION: ${{ needs.select-release.outputs.version }}
        run: bin/version "$RELEASE_VERSION"

      - name: Build all packages
        run: pnpm run build:all

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test

      - name: Restore CLI bundles after source-mode tests
        run: pnpm run build:cli

      - name: Verify isolated packed consumers
        run: pnpm run test:packages

      - name: Pack the exact six packages in dependency order
        env:
          RELEASE_VERSION: ${{ needs.select-release.outputs.version }}
        run: node bin/release.cjs pack "$RELEASE_VERSION" release-packages

      - name: Retain validated immutable archives for recovery investigation
        uses: actions/upload-artifact@v7
        with:
          name: release-packages-${{ needs.select-release.outputs.version }}-${{ github.run_attempt }}
          path: release-packages
          if-no-files-found: error

      # Node 24 bundles compatible npm. Assert the official npm >=11.5.1
      # minimum in the guard; never install tooling or write token .npmrc here.
      - name: Revalidate provenance and registry, then publish or verify each immutable version
        env:
          GH_TOKEN: ${{ github.token }}
        run: node bin/release.cjs publish release-packages

      - name: Retain verified publication source for this successful attempt
        uses: actions/upload-artifact@v7
        with:
          name: publication-${{ github.run_attempt }}
          path: release-packages/publication.json
          if-no-files-found: error
