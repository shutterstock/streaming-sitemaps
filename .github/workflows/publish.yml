name: Package and Publish

# Controls when the action will run.
on:
  release:
    types: [published]
  # push:
  #   branches:
  #     - main

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

env:
  npm_config_min_release_age: '7'

jobs:
  install-deps:
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.configure-nodejs.outputs.cache-key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Populate completed dependencies
        id: configure-nodejs
        uses: pwrdrvr/configure-nodejs@8876dbf3c524c8a765543dae3ae5b55d7b5ecfb3 # v1.6.0
        with:
          node-version: '^24.0.0'
          package-manager: pnpm
          working-directory: '.'
          dependency-cache: node-modules
          cache-mode: populate
          cache-inputs: packages/sitemaps-cdk/.projenrc.ts
          cache-key-suffix: streaming-sitemaps-8876dbf3c524c8a765543dae3ae5b55d7b5ecfb3-${{ hashFiles('package.json', 'packages/**/package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', '.npmrc', 'packages/**/.npmrc', 'packages/sitemaps-cdk/.projenrc.ts') }}

  publish:
    env:
      PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: 'false'
    needs:
      - install-deps
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Restore completed dependencies
        id: configure-nodejs
        uses: pwrdrvr/configure-nodejs@8876dbf3c524c8a765543dae3ae5b55d7b5ecfb3 # v1.6.0
        with:
          node-version: '^24.0.0'
          package-manager: pnpm
          working-directory: '.'
          dependency-cache: node-modules
          cache-mode: restore
          cache-inputs: packages/sitemaps-cdk/.projenrc.ts
          cache-key-suffix: streaming-sitemaps-8876dbf3c524c8a765543dae3ae5b55d7b5ecfb3-${{ hashFiles('package.json', 'packages/**/package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', '.npmrc', 'packages/**/.npmrc', 'packages/sitemaps-cdk/.projenrc.ts') }}

      - name: Require completed cache key to match the producer
        env:
          PRODUCER_CACHE_KEY: ${{ needs.install-deps.outputs.cache-key }}
          CONSUMER_CACHE_KEY: ${{ steps.configure-nodejs.outputs.cache-key }}
        run: |
          test -n "$PRODUCER_CACHE_KEY"
          test "$CONSUMER_CACHE_KEY" = "$PRODUCER_CACHE_KEY"
          printf 'Completed dependency cache key: %s\n' "$CONSUMER_CACHE_KEY"

      # Change owned source manifests only. Verification stays disabled in
      # strict consumers, and no consumer saves the dependency tree.
      - name: Set version for PR or from Tag
        run: |
          VERSION_TO_USE="${GITHUB_REF_NAME##*/}"
          echo "Version is ${VERSION_TO_USE}"
          bin/version "$VERSION_TO_USE"

      - name: Build
        run: pnpm run build:all

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test

      - name: Restore CLI bundles after source-mode tests
        run: pnpm run build:cli

      - name: NPM registry authentication
        run: npm set //registry.npmjs.org/:_authToken ${{ secrets.NPMJSORG_PUBLISH_TOKEN }}

      - name: Release supporting libraries - NPM
        run: |
          pnpm --dir packages/sitemaps-wrapper-lib pack
          npm publish packages/sitemaps-wrapper-lib/*.tgz --ignore-scripts

      - name: Release sitemaps-cli - NPM
        id: sitemaps-cli
        working-directory: packages/sitemaps-cli
        run: |
          pnpm pack
          npm publish ./*.tgz --ignore-scripts

      - name: Release sitemaps-db-lib - NPM
        id: sitemaps-db-lib
        working-directory: packages/sitemaps-db-lib
        run: |
          pnpm pack
          npm publish ./*.tgz --ignore-scripts

      - name: Release sitemaps-metrics-lib - NPM
        id: sitemaps-metrics-lib
        working-directory: packages/sitemaps-metrics-lib
        run: |
          pnpm pack
          npm publish ./*.tgz --ignore-scripts

      - name: Release sitemaps-models-lib - NPM
        id: sitemaps-models-lib
        working-directory: packages/sitemaps-models-lib
        run: |
          pnpm pack
          npm publish ./*.tgz --ignore-scripts

      - name: Release sitemaps-cdk - NPM
        id: sitemaps-cdk
        working-directory: packages/sitemaps-cdk
        run: |
          # pnpm run release
          pnpm pack
          npm publish ./*.tgz --ignore-scripts
