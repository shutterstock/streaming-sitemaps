name: Build and Deploy - CI

# Controls when the action will run.
on:
  push:
    branches:
      - main
    paths:
      - '**'
      - '!cf/**'
  pull_request:
    paths:
      - '**'
      - '!cf/**'
    types:
      - opened
      - synchronize
      - labeled
      - unlabeled
      - reopened

permissions:
  contents: read

env:
  npm_config_min_release_age: '7'
  AWS_REGION: 'us-east-1'
  PR_NUMBER: ${{ github.event.pull_request.number }}
  GITHUB_REPOSITORY_DASH: ${{ github.repository_owner }}-${{ github.event.repository.name }}
jobs:
  check-access:
    runs-on: ubuntu-latest
    outputs:
      has-token-access: ${{ steps.check.outputs.has-token-access }}
    steps:
      - id: check
        run: |
          echo "has-token-access=$(if [[ '${{ github.event.pull_request.head.repo.fork }}' != 'true' && '${{ github.actor }}' != 'dependabot[bot]' ]]; then echo 'true'; else echo 'false'; fi)" >> "$GITHUB_OUTPUT"

  install-deps:
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.configure-nodejs.outputs.cache-key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Populate completed dependencies
        id: configure-nodejs
        uses: pwrdrvr/configure-nodejs@8876dbf3c524c8a765543dae3ae5b55d7b5ecfb3 # v1.6.0
        with:
          node-version: '^24.0.0'
          package-manager: pnpm
          working-directory: '.'
          dependency-cache: node-modules
          cache-mode: populate
          cache-inputs: packages/sitemaps-cdk/.projenrc.ts
          cache-key-suffix: streaming-sitemaps-8876dbf3c524c8a765543dae3ae5b55d7b5ecfb3-${{ hashFiles('package.json', 'packages/**/package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', '.npmrc', 'packages/**/.npmrc', 'packages/sitemaps-cdk/.projenrc.ts') }}

  test:
    permissions:
      contents: read
      pull-requests: write
      issues: write
    needs:
      - install-deps
      - check-access
    runs-on: ubuntu-latest
    env:
      PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: 'false'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Restore completed dependencies
        id: configure-nodejs
        uses: pwrdrvr/configure-nodejs@8876dbf3c524c8a765543dae3ae5b55d7b5ecfb3 # v1.6.0
        with:
          node-version: '^24.0.0'
          package-manager: pnpm
          working-directory: '.'
          dependency-cache: node-modules
          cache-mode: restore
          cache-inputs: packages/sitemaps-cdk/.projenrc.ts
          cache-key-suffix: streaming-sitemaps-8876dbf3c524c8a765543dae3ae5b55d7b5ecfb3-${{ hashFiles('package.json', 'packages/**/package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', '.npmrc', 'packages/**/.npmrc', 'packages/sitemaps-cdk/.projenrc.ts') }}

      - name: Require completed cache key to match the producer
        env:
          PRODUCER_CACHE_KEY: ${{ needs.install-deps.outputs.cache-key }}
          CONSUMER_CACHE_KEY: ${{ steps.configure-nodejs.outputs.cache-key }}
        run: |
          test -n "$PRODUCER_CACHE_KEY"
          test "$CONSUMER_CACHE_KEY" = "$PRODUCER_CACHE_KEY"
          printf 'Completed dependency cache key: %s\n' "$CONSUMER_CACHE_KEY"

      - name: Build All TypeScript
        run: |
          pnpm run build:all

      - name: Test foundation helpers
        run: pnpm run test:foundation

      - name: Lint TypeScript
        run: pnpm run lint

      - name: Run Node Tests
        run: pnpm run test

      - name: Upload code coverage
        if: github.event_name == 'pull_request' && needs.check-access.outputs.has-token-access == 'true'
        uses: ./.github/actions/coverage-report
        with:
          lcov-file: coverage/lcov.info
          title: Node.js Code Coverage Report

  build:
    if: always()
    needs:
      - test
      - install-deps
    env:
      NODE_ENV: dev
      PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Require dependency setup and tests to succeed
        env:
          INSTALL_RESULT: ${{ needs.install-deps.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          test "$INSTALL_RESULT" = 'success'
          test "$TEST_RESULT" = 'success'

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Restore completed dependencies
        id: configure-nodejs
        uses: pwrdrvr/configure-nodejs@8876dbf3c524c8a765543dae3ae5b55d7b5ecfb3 # v1.6.0
        with:
          node-version: '^24.0.0'
          package-manager: pnpm
          working-directory: '.'
          dependency-cache: node-modules
          cache-mode: restore
          cache-inputs: packages/sitemaps-cdk/.projenrc.ts
          cache-key-suffix: streaming-sitemaps-8876dbf3c524c8a765543dae3ae5b55d7b5ecfb3-${{ hashFiles('package.json', 'packages/**/package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', '.npmrc', 'packages/**/.npmrc', 'packages/sitemaps-cdk/.projenrc.ts') }}

      - name: Require completed cache key to match the producer
        env:
          PRODUCER_CACHE_KEY: ${{ needs.install-deps.outputs.cache-key }}
          CONSUMER_CACHE_KEY: ${{ steps.configure-nodejs.outputs.cache-key }}
        run: |
          test -n "$PRODUCER_CACHE_KEY"
          test "$CONSUMER_CACHE_KEY" = "$PRODUCER_CACHE_KEY"
          printf 'Completed dependency cache key: %s\n' "$CONSUMER_CACHE_KEY"

      # Change owned source manifests only. Verification stays disabled in
      # strict consumers, and no consumer saves the dependency tree.
      - name: Set version for PR
        id: version
        if: github.event_name == 'pull_request'
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          CURRENT_VERSION=$(jq -r '.version' package.json)
          VERSION_TO_USE=${CURRENT_VERSION}-pr${PR_NUMBER}
          echo "Version is ${VERSION_TO_USE}"
          echo "version=${VERSION_TO_USE}" >> "$GITHUB_OUTPUT"
          bin/version "$VERSION_TO_USE"

      - name: Build All TypeScript
        run: |
          pnpm run build:all

      # Type-aware lint resolves declarations from sibling workspace packages.
      - name: Run Lint
        run: pnpm run lint

      - name: Pack all six public packages in dependency order without credentials
        run: |
          VERSION_TO_USE=$(node -p 'require("./package.json").version')
          node bin/release.cjs pack "$VERSION_TO_USE" release-packages
          node bin/release.cjs dry-run "$VERSION_TO_USE" release-packages

      - name: Upload validated public archives and integrity plan
        uses: actions/upload-artifact@v7
        with:
          name: public-packages
          path: release-packages
          if-no-files-found: error

      - name: Verify clean-room packaged CLI consumption
        run: pnpm run test:cli:packaged

      - name: Verify the packed JavaScript CDK package in an isolated consumer
        run: |
          VERSION=$(node -p "require('./packages/sitemaps-cdk/package.json').version")
          pnpm run test:cdk-consumer "release-packages/shutterstock-sitemaps-cdk-${VERSION}.tgz"

      - name: Upload CDK consumer diagnostics and local assembly
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sitemaps-cdk-consumer
          path: .validation/cdk-consumer/
          if-no-files-found: ignore

      - name: Verify every public tarball in isolated offline consumers
        run: pnpm run test:packages

  deploy:
    # Disable for now as we have no CDK stack to deploy
    if: ${{ false }}
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: deploy-${{ vars.NODE_ENV }}-${{ github.workflow }}-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    env:
      NODE_ENV: ${{ vars.NODE_ENV }}
      PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: 'false'
    needs:
      - build
      - install-deps
    environment: dev
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - if: github.event_name == 'pull_request'
        name: Set Hotswap Flag on Pre-Switch
        run: echo 'CDK_HOTSWAP_PRS=--hotswap' >> "$GITHUB_ENV"

      - name: Compute PR Suffix
        run: |
          if [ -n "${PR_NUMBER}" ]; then
            echo "PR_SUFFIX=-pr-${PR_NUMBER}" >> "$GITHUB_ENV"
          else
            echo 'PR_SUFFIX=' >> "$GITHUB_ENV"
          fi

      - name: Restore completed dependencies
        id: configure-nodejs
        uses: pwrdrvr/configure-nodejs@8876dbf3c524c8a765543dae3ae5b55d7b5ecfb3 # v1.6.0
        with:
          node-version: '^24.0.0'
          package-manager: pnpm
          working-directory: '.'
          dependency-cache: node-modules
          cache-mode: restore
          cache-inputs: packages/sitemaps-cdk/.projenrc.ts
          cache-key-suffix: streaming-sitemaps-8876dbf3c524c8a765543dae3ae5b55d7b5ecfb3-${{ hashFiles('package.json', 'packages/**/package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', '.npmrc', 'packages/**/.npmrc', 'packages/sitemaps-cdk/.projenrc.ts') }}

      - name: Require completed cache key to match the producer
        env:
          PRODUCER_CACHE_KEY: ${{ needs.install-deps.outputs.cache-key }}
          CONSUMER_CACHE_KEY: ${{ steps.configure-nodejs.outputs.cache-key }}
        run: |
          test -n "$PRODUCER_CACHE_KEY"
          test "$CONSUMER_CACHE_KEY" = "$PRODUCER_CACHE_KEY"
          printf 'Completed dependency cache key: %s\n' "$CONSUMER_CACHE_KEY"

      - name: Build All TypeScript
        run: |
          pnpm run build:all

      # TODO: Use build role
      # - name: Use Build Role
      #   id: build-role

      - name: Deploy CDK Stack
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
        run: |
          # shellcheck disable=SC2086
          pnpm exec cdk deploy ${CDK_HOTSWAP_PRS} --require-approval never sitemaps

      - name: Compute Stack Output Name
        run: |
          echo "S3_SITEMAPS_BUCKET_ARN_EXPORT=s3SitemapsBucketArn-${NODE_ENV}${PR_SUFFIX}" >> "$GITHUB_ENV"
          echo "S3_SITEMAPS_BUCKET_NAME_EXPORT=s3SitemapsBucketName-${NODE_ENV}${PR_SUFFIX}" >> "$GITHUB_ENV"

      - name: Check Stack Outputs
        run: |
          aws cloudformation list-exports --query "Exports[?Name==\`${S3_SITEMAPS_BUCKET_ARN_EXPORT}}\`].Value"  --output text
          aws cloudformation list-exports --query "Exports[?Name==\`${S3_SITEMAPS_BUCKET_NAME_EXPORT}}\`].Value"  --output text
