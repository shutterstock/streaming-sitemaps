name: Publish Docs

on:
  workflow_run:
    workflows: [Package and Publish]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Current fully published stable tag (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read
  actions: read

env:
  npm_config_min_release_age: '7'

concurrency:
  group: npm-release-and-docs
  queue: max
  cancel-in-progress: false

jobs:
  select-docs:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.docs.outputs.publish }}
      version: ${{ steps.docs.outputs.version }}
      commit: ${{ steps.docs.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node 24 for dependency-free provenance guards
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '^24.0.0'
          package-manager-cache: false

      - name: Select fully published stable tag and verify release provenance
        id: docs
        env:
          GH_TOKEN: ${{ github.token }}
        run: node bin/release.cjs docs-select

  install-deps:
    needs: select-docs
    if: needs.select-docs.outputs.publish == 'true'
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.configure-nodejs.outputs.cache-key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.select-docs.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Populate completed dependencies
        id: configure-nodejs
        uses: pwrdrvr/configure-nodejs@8876dbf3c524c8a765543dae3ae5b55d7b5ecfb3 # v1.6.0
        with:
          node-version: '^24.0.0'
          package-manager: pnpm
          working-directory: '.'
          dependency-cache: node-modules
          cache-mode: populate
          cache-inputs: packages/sitemaps-cdk/.projenrc.ts
          cache-key-suffix: streaming-sitemaps-8876dbf3c524c8a765543dae3ae5b55d7b5ecfb3-${{ hashFiles('package.json', 'packages/**/package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', '.npmrc', 'packages/**/.npmrc', 'packages/sitemaps-cdk/.projenrc.ts') }}

  build:
    permissions:
      contents: write
      actions: read
    needs: [select-docs, install-deps]
    runs-on: ubuntu-latest
    env:
      PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: 'false'
      RELEASE_VERSION: ${{ needs.select-docs.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.select-docs.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Restore completed dependencies
        id: configure-nodejs
        uses: pwrdrvr/configure-nodejs@8876dbf3c524c8a765543dae3ae5b55d7b5ecfb3 # v1.6.0
        with:
          node-version: '^24.0.0'
          package-manager: pnpm
          working-directory: '.'
          dependency-cache: node-modules
          cache-mode: restore
          cache-inputs: packages/sitemaps-cdk/.projenrc.ts
          cache-key-suffix: streaming-sitemaps-8876dbf3c524c8a765543dae3ae5b55d7b5ecfb3-${{ hashFiles('package.json', 'packages/**/package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', '.npmrc', 'packages/**/.npmrc', 'packages/sitemaps-cdk/.projenrc.ts') }}

      - name: Require completed cache key to match the producer
        env:
          PRODUCER_CACHE_KEY: ${{ needs.install-deps.outputs.cache-key }}
          CONSUMER_CACHE_KEY: ${{ steps.configure-nodejs.outputs.cache-key }}
        run: |
          test -n "$PRODUCER_CACHE_KEY"
          test "$CONSUMER_CACHE_KEY" = "$PRODUCER_CACHE_KEY"
          printf 'Completed dependency cache key: %s\n' "$CONSUMER_CACHE_KEY"

      - name: Inject verified stable version after strict restore
        run: bin/version "$RELEASE_VERSION"

      - name: Build Docs
        run: |
          pnpm run build
          pnpm run build:docs

      - name: Recheck full stable publication and immutable source before deployment
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: node bin/release.cjs docs-verify

      - name: Deploy to GitHub Pages
        if: steps.deployment.outputs.publish == 'true'
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
