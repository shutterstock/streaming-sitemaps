packages:
  - packages/*

# Seven days, in minutes. Keep this policy when resolving new dependencies.
minimumReleaseAge: 10080

# Prefer APFS clones; fall back to hard links/copies on other filesystems.
packageImportMethod: auto
nodeLinker: isolated

# Corepack owns the pin; use one Dependabot-readable v9 lock document.
pmOnFail: ignore

# This test helper's declarations import Smithy types without declaring them.
# Match the runtime SDK's Smithy 4 graph instead of accepting ambient copies.
packageExtensions:
  aws-sdk-client-mock@4.1.0:
    dependencies:
      '@smithy/smithy-client': ^4.9.8
      '@smithy/types': ^4.9.0

overrides:
  # DynamoDB's development-only v2 SDK uses the compatible CommonJS v4 API.
  aws-sdk>uuid: 11.1.1
  # downlevel-dts declares '*'; TypeScript 7 lacks the compiler API it uses.
  downlevel-dts@0.11.0>typescript: 6.0.3

# Native tooling required by the existing esbuild/dynalite toolchain.
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': false
  aws-sdk: false
  esbuild: true
  leveldown: true
  unrs-resolver: true
  yarn: false
